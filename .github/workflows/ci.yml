name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dictee
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/dictee
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/dictee
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/dictee
      NEXTAUTH_SECRET: ci-dummy-secret-not-used-anywhere
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Contournement d'un bug npm : les dépendances optionnelles natives de
      # lightningcss/@tailwindcss ne sont pas installées quand le lockfile
      # a été généré sur une autre plateforme (Windows -> Linux ici).
      - name: Install native Linux binaries
        run: npm install --no-save lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      # Lint désactivé : `next lint` a été retiré dans Next.js 16 et
      # ESLint 10 requiert une migration vers le flat config.
      # À réactiver après migration ESLint.

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
