name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dictee
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/dictee
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/dictee
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/dictee
      NEXTAUTH_SECRET: ci-dummy-secret-not-used-anywhere
      NEXTAUTH_URL: http://localhost:3000
      # Valeurs factices : seule leur présence est vérifiée au build.
      GOOGLE_ID: ci-dummy-google-id
      GOOGLE_SECRET: ci-dummy-google-secret
      SECRET: ci-dummy-secret-not-used-anywhere
      AUTH_SECRET: ci-dummy-secret-not-used-anywhere

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      # Lint désactivé : `next lint` a été retiré dans Next.js 16 et
      # ESLint 10 requiert une migration vers le flat config.
      # À réactiver après migration ESLint.

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: yarn build
